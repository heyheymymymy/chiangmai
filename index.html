<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light only">
<title>清邁 8 日行程</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Isometra&display=swap">
<style>
:root{
  color-scheme:light;
  /* 旅行感配色：暖白底＋大地色系 */
  --page:#ffffff;--text:#2b2622;--text2:#6e665e;--muted:#a39a90;--line:#efeae3;--border:#e2dbd2;
  --accent-bg:#F7E6DA;--accent-fg:#9A4A25;           /* 陶土橘：選取中的天數 */
  --eat-bg:#FCEBDD;--eat-bd:#F0B48C;--eat-fg:#8A4B22;  /* 吃：芒果蜜桃 */
  --spa-bg:#E9F0E4;--spa-bd:#A9C49C;--spa-fg:#3F5E3A;  /* 按摩：香茅綠 */
  --cafe-bg:#F3ECE3;--cafe-bd:#CDB59A;--cafe-fg:#6B4E36; /* 咖啡：拿鐵奶茶 */
  --shop-bg:#E5EEF3;--shop-bd:#9DBDD0;--shop-fg:#355C74; /* 購物：霧藍 */
  --bar-bg:#F4E3E7;--bar-bd:#D7A2AE;--bar-fg:#7A2E40;    /* 酒吧：酒紅 */
  --see-bg:#EEEAF4;--see-bd:#BFB3D6;--see-fg:#5B4B7A;    /* 景點、活動：薰衣草 */
  --other-bg:#EFEDEA;--other-bd:#CFC8BF;--other-fg:#5E5850; /* 其他（交通、住宿）：灰米 */
  --now:#E24B4A;
  --hour:60px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:10;background:var(--page);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
/* 天數列：放得下時置中；放不下時可左右滑，兩側保留 16px 邊界 */
.tabs{overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;-webkit-overflow-scrolling:touch;scroll-padding:0 16px}
.tabs-in{display:flex;align-items:center;gap:2px;width:max-content;margin:0 auto;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
/* 還能往左／往右滑時，該側邊緣淡出 */
.tabs{--fl:0px;--fr:0px;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);
          mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
.tabs.fade-l{--fl:36px}
.tabs.fade-r{--fr:36px}
.tab{flex:none;padding:5px 8px;border-radius:8px;font-size:13px;color:var(--text2);border:0;background:none}
/* 天數按鈕：正圓、數字置中 */
.tab.day{width:30px;height:30px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  line-height:1;font-variant-numeric:tabular-nums}
.tab.on{background:var(--accent-bg);color:var(--accent-fg);font-weight:600}
/* 單日大標題：英文書寫體，營造度假感 */
.day-title{font-family:"Isometra",cursive;font-size:36px;font-weight:400;line-height:1.15;color:var(--accent-fg);text-align:center}
.day-sub{font-size:13px;color:var(--text2);margin-top:4px;text-align:center}
.tl{position:relative;margin:14px 16px 40px 0;transition:height .25s ease;touch-action:pan-y pinch-zoom}
/* 卡片層：時間線固定不動，只有這一層左右滑 */
.cards{position:absolute;top:0;bottom:0;left:52px;right:0;overflow:hidden}
.layer{position:absolute;inset:0}
.layer.drag{will-change:transform}
.layer.anim{transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.tl.sliding .now{opacity:0}
.mv{transition:top .25s ease}
/* 總覽：全部從每天的行程算出來，改了行程這裡自動跟著變 */
.ov{padding:16px 16px 48px;touch-action:pan-y pinch-zoom}
/* 第 1 天和總覽之間滑動換頁：新的那頁從滑過來的方向淡入 */
@keyframes inL{from{transform:translateX(-48px);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(48px);opacity:0}to{transform:none;opacity:1}}
.in-l{animation:inL .26s ease}
.in-r{animation:inR .26s ease}
.ov-sec{font-size:12px;font-weight:600;color:var(--muted);margin:22px 0 8px}
.ov-sec:first-child{margin-top:0}
.ov-row{display:flex;align-items:flex-start;gap:10px;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;
  font:inherit;color:var(--text);text-align:left;cursor:pointer}
.ov-row:first-of-type{border-top:0}
.ov-when{flex:none;width:86px;font-size:12px;color:var(--text2);line-height:1.45}
.ov-when b{display:block;font-size:13px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.ov-places{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ov-place{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;font-weight:600;line-height:1.35}
.ov-place .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-row .ov-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c-bd)}
.ov-ok{flex:none;font-size:14px;color:var(--spa-fg)}
.ov-row .ti-chevron-right{flex:none;color:var(--muted);margin-top:1px}
.ov-stats{display:flex;flex-wrap:wrap;gap:6px}
.ov-stat{display:flex;align-items:baseline;gap:4px;padding:6px 10px;border-radius:10px;background:var(--c-bg);color:var(--c-fg);font-size:12px}
.ov-stat b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.ov-chips{display:flex;flex-wrap:wrap;gap:6px}
.ov-chip{max-width:100%;padding:4px 10px;border-radius:999px;border:0;font:inherit;font-size:12px;background:var(--c-bg);color:var(--c-fg);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ov-chip b{font-weight:600;font-variant-numeric:tabular-nums}
.ov-empty{font-size:13px;color:var(--muted);padding:6px 0}
.hr{position:absolute;left:0;width:44px;text-align:right;font-size:11px;color:var(--muted)}
.ln{position:absolute;left:52px;right:0;border-top:1px solid var(--line)}
.blk{position:absolute;left:4px;right:0;padding:6px 10px 5px;border:0;border-radius:8px;overflow:hidden}
.blk .t{font-size:15px;font-weight:600;display:flex;align-items:center;gap:4px;min-height:22px}
.blk .t .tm{font-size:12px;font-weight:400;white-space:nowrap}
/* 短卡片：標題列垂直置中 */
.blk.compact{display:flex;align-items:center;padding-top:0;padding-bottom:0}
.blk .s{font-size:12px;margin-top:1px}
/* 一句話描述：放在標題和時間中間，卡片放得下幾行就顯示幾行 */
.blk .d{font-size:12px;line-height:16px;margin:1px 0 2px;opacity:.85;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.car{position:absolute;left:12px;z-index:4;height:16px;line-height:16px;font-size:11px;color:var(--text2);white-space:nowrap}
.eat{background:var(--eat-bg);border-color:var(--eat-bd);color:var(--eat-fg);--c-bg:var(--eat-bg);--c-bd:var(--eat-bd);--c-fg:var(--eat-fg)}
.spa{background:var(--spa-bg);border-color:var(--spa-bd);color:var(--spa-fg);--c-bg:var(--spa-bg);--c-bd:var(--spa-bd);--c-fg:var(--spa-fg)}
.cafe{background:var(--cafe-bg);border-color:var(--cafe-bd);color:var(--cafe-fg);--c-bg:var(--cafe-bg);--c-bd:var(--cafe-bd);--c-fg:var(--cafe-fg)}
.shop{background:var(--shop-bg);border-color:var(--shop-bd);color:var(--shop-fg);--c-bg:var(--shop-bg);--c-bd:var(--shop-bd);--c-fg:var(--shop-fg)}
.bar{background:var(--bar-bg);border-color:var(--bar-bd);color:var(--bar-fg);--c-bg:var(--bar-bg);--c-bd:var(--bar-bd);--c-fg:var(--bar-fg)}
.see{background:var(--see-bg);border-color:var(--see-bd);color:var(--see-fg);--c-bg:var(--see-bg);--c-bd:var(--see-bd);--c-fg:var(--see-fg)}
.other{background:var(--other-bg);border-color:var(--other-bd);color:var(--other-fg);--c-bg:var(--other-bg);--c-bd:var(--other-bd);--c-fg:var(--other-fg)}
.grp{position:absolute;left:4px;right:0;z-index:2;background:var(--eat-bg);border:0;
  border-radius:8px;padding:6px 10px 5px;color:var(--eat-fg);cursor:pointer;overflow:hidden;transition:height .25s ease}
/* 合併區塊跟著類型換顏色（預設是吃） */
.grp.spa{background:var(--spa-bg);color:var(--spa-fg)}.grp.cafe{background:var(--cafe-bg);color:var(--cafe-fg)}
.grp.shop{background:var(--shop-bg);color:var(--shop-fg)}.grp.see{background:var(--see-bg);color:var(--see-fg)}
.grp.bar{background:var(--bar-bg);color:var(--bar-fg)}.grp.other{background:var(--other-bg);color:var(--other-fg)}
.grp .head{display:flex;justify-content:space-between;align-items:center}
.list{display:none;margin:8px -10px 0;background:#fff;background:color-mix(in srgb,var(--c-bg,var(--eat-bg)) 30%,#fff);border-top:1px solid var(--c-bd,var(--eat-bd));padding:2px 12px 4px;color:var(--text);cursor:default}
.grp.open .list{display:block}
.grp.open .sum{display:none}
.stop{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.num{width:22px;height:22px;border-radius:50%;background:var(--c-bg,var(--eat-bg));color:var(--c-fg,var(--eat-fg));font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.stop .n{font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;min-height:22px}
.stop .o{font-size:12px;color:var(--text2)}
.stop .m{font-size:11px;color:var(--muted);margin-top:3px}
.nav{width:22px;height:22px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.75);color:inherit;text-decoration:none;font-size:13px}
.nav{position:relative}
.nav::after{content:"";position:absolute;inset:-9px}
.nav:active{transform:scale(.92)}
/* 讓按鈕裡的圖示真正置中（拿掉字型行高造成的偏移） */
.nav i,.note-btn i{display:block;width:1em;height:1em;line-height:1;text-align:center}
.nav i::before,.note-btn i::before{display:block}
.blk > .nav{position:absolute;top:6px;right:8px}   /* 卡片本身的導航鈕放右上角；展開清單裡的照常排在每一列 */
.blk.compact > .nav{top:50%;transform:translateY(-50%)}
.blk.has-nav{padding-right:36px}
.stop .nav{align-self:center;border:1px solid var(--line);color:var(--text2)}
.blk{transition:height .25s ease,top .25s ease}
/* 幾間挑一間：每一家是平行的選項，用空心圓圈代替編號 */
.num.pick{background:transparent;border:2px solid var(--c-bd,var(--eat-bd));width:18px;height:18px;margin:3px 2px 0}
.list .cap{font-size:11px;color:var(--muted);padding-top:8px}
.list .cap + .stop{border-top:0}
/* 展開後：線條和編號跟著卡片的類型顏色；白色清單一路延伸到卡片底部，不留一大塊色塊 */
.grp.open{display:flex;flex-direction:column;padding-bottom:0}
.grp.open .list{flex:1 0 auto}
.now{position:absolute;left:46px;right:0;border-top:2px solid var(--now);z-index:3}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.note-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;
  border:0;border-radius:50%;background:rgba(255,255,255,.75);color:inherit;font-size:13px;cursor:pointer;padding:0}
.note-btn::after{content:"";position:absolute;inset:-9px}
.note-btn:active{transform:scale(.92)}
.stop .note-btn{background:var(--line);color:var(--text2)}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(20,20,18,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:480px;margin:0 auto;max-height:82vh;overflow-y:auto;
  background:#fff;border-radius:18px 18px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .25s ease;overscroll-behavior:contain}
.sheet.on{transform:none}
/* 浮出來的小視窗（輸入通關密碼、確認放棄）：放在鍵盤上方的可見範圍正中間，不會被鍵盤擋住 */
.sheet.dlg{left:16px;right:16px;bottom:auto;top:0;max-height:none;border-radius:18px;padding:18px 18px 0;
  transform:scale(.96);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.sheet.dlg.on{transform:none;opacity:1;pointer-events:auto}
.sheet.dlg .grab{display:none}
.sheet.dlg .ed-actions{position:static;margin-top:18px;padding:12px 18px 16px;border-radius:0 0 18px 18px}
/* 拉桿：固定在面板最上面，內容往上捲時不會跟著捲走；整條白色橫條都可以按著往下拉 */
.grab{position:sticky;top:-8px;z-index:3;height:22px;margin:-8px -18px 2px;background:#fff;border-radius:18px 18px 0 0}
.grab::before{content:"";position:absolute;left:50%;top:8px;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--border)}
.ed-full textarea{font-size:14px}
/* 照片：筆記最上方的大照片（直角）；編輯面板裡的預覽 */
.sh-photo{display:block;width:100%;aspect-ratio:339/206;object-fit:cover;background:var(--line);margin:0 0 14px}
.ph-prev{position:relative}
.ph-badge{position:absolute;right:8px;bottom:8px;padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:12px}
.ph-prev img{display:block;width:100%;aspect-ratio:339/206;object-fit:cover;background:var(--line)}
.ph-prev.empty{display:flex;align-items:center;justify-content:center;height:64px;border:1px dashed var(--border);border-radius:10px;font-size:13px;color:var(--muted)}
.ph-row{display:flex;gap:8px;margin-top:8px}
.ph-row input{flex:1;min-width:0}
.ph-up{flex:none;font-size:15px;font-weight:500}
.ph-st{font-size:12px;color:var(--muted);margin-top:4px;min-height:0}
.ph-st:empty{display:none}
.ed-full .ed-hint{margin:0 0 8px}
.sh-head{display:flex;gap:10px;align-items:flex-start}
.sh-title{font-size:18px;font-weight:600;line-height:1.35}
.sh-sub{font-size:13px;color:var(--text2);margin-top:2px}
.sh-close{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--line);color:var(--text2);font-size:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.sh-head .nav{border:1px solid var(--line);color:var(--text2);width:30px;height:30px}
.mine{margin:14px 0 4px;padding:10px 12px;border-radius:10px;background:var(--eat-bg);color:var(--eat-fg);font-size:14px;line-height:1.6}
.mine b{display:block;font-size:12px;font-weight:600;margin-bottom:2px}
.sh-sec{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.sh-list{margin:0;padding-left:18px;font-size:14px;line-height:1.7}
/* 完整筆記：預設收起來，點標題展開 */
.full-note{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.full-note summary{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;list-style:none}
.full-note summary::-webkit-details-marker{display:none}
.full-note summary i{transition:transform .2s}
.full-note[open] summary i{transform:rotate(180deg)}
.full-txt{margin-top:10px;font-size:14px;line-height:1.75;color:var(--text);white-space:pre-wrap;word-break:break-word}
.full-txt a{color:var(--accent-fg);word-break:break-all}
.sh-links a{display:block;font-size:13px;color:var(--accent-fg);margin:4px 0;word-break:break-all}

[hidden]{display:none!important}
/* 編輯模式：標題、副標主題可以直接點來打字 */
.inline-edit{outline:none;cursor:text;border-radius:4px;
  background-image:linear-gradient(to right,currentColor 50%,transparent 50%);background-size:6px 1.5px;background-repeat:repeat-x;background-position:0 100%}
.day-title.inline-edit{display:table;margin:0 auto;min-width:2em;background-size:8px 2px;padding-bottom:2px}   /* 虛線只畫在文字底下 */
.inline-edit:focus{background-image:none;background-color:var(--accent-bg)}
/* ---------- 編輯模式 ---------- */
.edit-btn{position:absolute;right:16px;bottom:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--text2);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.edit-btn i{display:block;line-height:1}
.editing .edit-btn{display:none}
/* 編輯列蓋掉天數列，高度跟天數列一樣（30px），進出編輯時頁首不會跳動 */
.editbar{display:none;align-items:center;gap:6px;height:30px;margin:0 0 10px;padding:0;background:none;color:var(--accent-fg);font-size:13px;font-weight:600}
.editing .editbar{display:flex}
.editing .tabs{display:none}
.eb-label{flex:1}
.eb-btn{height:26px;padding:0 12px;border-radius:999px;border:0;background:var(--accent-bg);color:var(--accent-fg);font-size:13px;font-weight:600;cursor:pointer}
.eb-btn.done{background:var(--accent-fg);color:#fff}
.eb-st{font-weight:400;color:var(--text2)}
.eb-st.err{border:0;background:none;padding:0;font:inherit;font-weight:600;color:#C2412D;cursor:pointer}
.tl-msg{position:absolute;left:52px;right:0;top:40px;text-align:center;font-size:14px;color:var(--muted);z-index:5}
.edit-ic{display:none;position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.75);
  align-items:center;justify-content:center;font-size:13px}
.edit-ic i{display:block;line-height:1}
.blk.compact .edit-ic{top:50%;transform:translateY(-50%)}
.editing .edit-ic{display:flex}
.editing .nav,.editing .note-btn{display:none}
.sub-ed{display:none;align-self:center;width:22px;height:22px;flex:none;border-radius:50%;background:var(--line);color:var(--text2);
  align-items:center;justify-content:center;font-size:12px}
.sub-ed i{display:block;line-height:1}
.editing .sub-ed{display:flex}
.editing .stop{cursor:pointer}
/* 拖曳 */
/* 卡片長按＝編輯，不要選取文字或跳出系統的「拷貝」選單 */
.layer .blk,.layer .grp{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.blk,.grp,.stop{transition-property:height,top,transform,background-color}
.pressing{transform:scale(.97);transition:transform .55s ease!important}
.stop.pressing{transform:none;background:rgba(0,0,0,.04)}
.dragging{z-index:30!important;pointer-events:none;box-shadow:0 10px 24px rgba(60,30,10,.22);opacity:.8}   /* 半透明，才看得到底下要交換的卡片 */
.drop-target{box-shadow:inset 0 0 0 2px var(--accent-fg)}
/* 拖進展開的卡片：整張虛線框，插入的位置畫一條線 */
.drop-into{box-shadow:inset 0 0 0 2px var(--accent-fg)}
.drop-into .list{background:color-mix(in srgb,var(--c-bg,var(--eat-bg)) 60%,#fff)}
.stop.ins,.add-sub.ins{box-shadow:0 -3px 0 var(--accent-fg)}
/* 把某一站／某個選項拖出來：原本那列變淡，手指下面跟著一張小卡片；時間軸上標出會放在幾點 */
.stop.sub-dragging{opacity:.3}
.sub-ghost{position:fixed;z-index:40;pointer-events:none;background:#fff;border-radius:10px;padding:8px 12px;margin:0;
  box-shadow:0 10px 24px rgba(60,30,10,.22);opacity:.92;border:0}
.sub-ghost .nav,.sub-ghost .note-btn,.sub-ghost .sub-ed{display:none}
.drop-slot{position:absolute;left:50px;right:4px;z-index:4;border-top:2px dashed var(--accent-fg);pointer-events:none}
.drop-slot span{position:absolute;left:0;top:2px;font-size:11px;font-weight:600;color:var(--accent-fg);background:var(--bg,#fff);padding:0 4px;border-radius:4px}
.drag-on .blk:not(.dragging),.drag-on .grp:not(.dragging){transition:box-shadow .12s}
.add-sub{display:none;width:100%;height:38px;margin:6px 0 4px;border:1px dashed var(--border);border-radius:10px;background:#fff;
  color:var(--text2);font-size:14px;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.editing .add-sub{display:flex}
/* 可展開的卡片：右上角是展開箭頭，鉛筆改放在標題後面，兩個按鈕才不會擠在一起 */
.grp .head .t{display:flex;align-items:center;gap:4px;min-width:0}
.grp .head .edit-ic{position:static;flex:none;margin-left:4px}
.grp .chev{padding:4px;margin:-4px}
.editing .blk,.editing .grp{cursor:pointer}
.editing .cards{cursor:copy}
.clash{box-shadow:inset 0 0 0 2px #E24B4A}
.tag-ok{white-space:nowrap}
.fab{position:fixed;right:max(20px,calc(50vw - 220px));bottom:calc(24px + env(safe-area-inset-bottom));z-index:40;width:52px;height:52px;border-radius:50%;
  border:0;background:var(--accent-fg);color:#fff;font-size:24px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(60,30,10,.22);cursor:pointer}
.fab i{display:block;line-height:1}
.editing .fab.day{display:flex}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:10px 14px;border-radius:12px;background:#2b2622;color:#fff;font-size:14px;
  transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:#F7C9A8;font-size:14px;font-weight:600;padding:4px;cursor:pointer}
/* 編輯面板 */
.ed-field{display:block;margin-top:16px}
.ed-lab{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.ed-lab-hint{font-weight:400;margin-left:4px}
.map-status{margin-top:6px;font-size:13px;line-height:1.5;color:var(--text2)}
.map-status i{vertical-align:-1px}
.map-status .ok{color:#3F5E3A;font-weight:600}
.map-status a{color:var(--accent-fg)}
.sheet input[type=text],.sheet input[type=password],.sheet input[type=time],.sheet textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--border);
  border-radius:10px;background:#fff;color:var(--text);font-family:inherit;-webkit-appearance:none;appearance:none}
.sheet input[type=time]{width:auto;min-width:120px}
.sheet textarea{resize:vertical;line-height:1.5}
.sheet input:focus,.sheet textarea:focus{outline:2px solid var(--accent-bg);border-color:var(--accent-fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:14px;color:var(--text2);cursor:pointer}
.chip.on{border-color:transparent;background:var(--accent-bg);color:var(--accent-fg);font-weight:600}
.chip.on.eat{background:var(--eat-bg);color:var(--eat-fg)}.chip.on.spa{background:var(--spa-bg);color:var(--spa-fg)}
.chip.on.cafe{background:var(--cafe-bg);color:var(--cafe-fg)}.chip.on.shop{background:var(--shop-bg);color:var(--shop-fg)}
.chip.on.bar{background:var(--bar-bg);color:var(--bar-fg)}.chip.on.see{background:var(--see-bg);color:var(--see-fg)}.chip.on.other{background:var(--other-bg);color:var(--other-fg)}
.ed-row{display:flex;align-items:center;gap:12px}
.ed-to{font-size:15px;color:var(--text2)}
.ed-dur{min-width:96px;text-align:center;font-size:15px;font-weight:600}
/* 時間：一行「開始 → 結束 ｜ − 長度 +」，三個格子差不多寬、撐滿整行（長度那格稍寬，放得下「1h40m」）；結束是自動算的（灰色、不能點）。下一行長度快選 */
.ed-time{display:flex;align-items:center;gap:4px}
.sheet .ed-time input[type=time]{min-width:0;width:0;flex:1 1 0;padding:10px 4px;text-align:center}
.ed-time input[type=time]::-webkit-calendar-picker-indicator{display:none}   /* 電腦版瀏覽器的時鐘圖示會把格子撐寬；點格子一樣會跳出選擇器 */
.ed-time input[type=time]::-webkit-date-and-time-value{text-align:center}
.ed-arrow{color:var(--muted);flex:none;font-size:14px;margin:0 6px}
.ed-endbox{flex:1 1 0;min-width:0;font-size:16px;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:#F7F5F2;color:var(--muted);line-height:normal;white-space:nowrap;text-align:center;overflow:hidden}
.ed-mid{font-size:12px;color:var(--muted);margin-top:4px}
.ed-len{flex:1.2 1 0;min-width:0;display:flex;align-items:center;justify-content:space-between;margin-left:6px;height:44px}
.ed-len .step{width:26px;height:26px;flex:none;border:0;background:var(--line)}
.ed-len .ed-dur{min-width:0;font-size:14px;white-space:nowrap}
.chips.sm{flex:1;min-width:0;margin:0 0 0 4px}
.chips.sm{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.chips.sm::-webkit-scrollbar{display:none}
.chips.sm{gap:5px}
.chips.sm .chip{height:30px;padding:0 4px;font-size:13px;flex:1 1 0;min-width:0}   /* 每個長度標籤一樣寬，平均排滿一行 */
.step{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:#fff;color:var(--text);font-size:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.ed-check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px}
.ed-check input{width:20px;height:20px;accent-color:var(--accent-fg)}
.ed-check span{color:var(--muted);font-size:13px}
/* 開關（已訂位、後面的行程自動移動） */
/* 編輯面板的分段線：整條拉到面板左右邊緣 */
.ed-sep{border:0;border-top:1px solid var(--line);margin:20px -18px 0}
.ed-switch{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;cursor:pointer}
.ed-switch small{color:var(--muted);font-size:13px}
input.sw{-webkit-appearance:none;appearance:none;width:44px;height:26px;margin:0;border-radius:13px;background:var(--border);position:relative;flex:none;cursor:pointer;transition:background .2s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
input.sw:checked{background:var(--accent-fg)}
input.sw:checked::after{transform:translateX(18px)}
input.sw:focus-visible{outline:2px solid var(--accent-bg);outline-offset:2px}
.ed-lock,.ed-hint{margin-top:12px;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.5}
.ed-lock{background:#FFF1E2;color:#8A4B22}
.ed-hint{background:var(--line);color:var(--text2)}
.err{color:#C2412D;font-size:13px;margin-top:6px}
.ed-actions{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));display:flex;gap:8px;margin:20px -18px 0;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.btn{height:44px;padding:0 16px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;justify-content:center}
.btn.ghost{border:1px solid var(--border);background:#fff;color:var(--text)}
.btn.danger{color:#C2412D;border-color:#F2C9C0}
.btn.primary{flex:1;border:0;background:var(--accent-fg);color:#fff}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="editbar"><span class="eb-label"><i class="ti ti-pencil"></i> <span id="ebDay"></span>編輯中 · <span id="ebSt" class="eb-st">點空白處新增</span></span>
      <button type="button" class="eb-btn" id="editCancel">取消</button><button type="button" class="eb-btn done" id="editDone">完成</button></div>
    <nav class="tabs"><div class="tabs-in">
      <button class="tab" data-page="overview">總覽</button><button class="tab day" data-page="d1" aria-label="第 1 天">1</button><button class="tab day" data-page="d2" aria-label="第 2 天">2</button>
      <button class="tab day" data-page="d3" aria-label="第 3 天">3</button><button class="tab day" data-page="d4" aria-label="第 4 天">4</button><button class="tab day" data-page="d5" aria-label="第 5 天">5</button>
      <button class="tab day" data-page="d6" aria-label="第 6 天">6</button><button class="tab day" data-page="d7" aria-label="第 7 天">7</button><button class="tab day" data-page="d8" aria-label="第 8 天">8</button><button class="tab" data-page="cand">候選</button>
    </div></nav>
    <div class="day-title" id="dayTitle"></div>
    <div class="day-sub" id="daySub"></div>
    <button type="button" class="edit-btn" id="editBtn" aria-label="編輯行程"><i class="ti ti-pencil"></i></button>
  </header>
  <div class="tl" id="tl"></div>
  <div class="ov" id="ov" hidden></div>
</div>
<button type="button" class="fab" id="fab" aria-label="新增行程"><i class="ti ti-plus"></i></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"></div>
<script>
const PX = 1.25;                     // 1 分鐘 = 1.25px（1 小時 = 75px）
const tl = document.getElementById('tl');
const tabsEl = document.querySelector('.tabs');
function updateTabFade() {
  const max = tabsEl.scrollWidth - tabsEl.clientWidth;
  tabsEl.classList.toggle('fade-l', tabsEl.scrollLeft > 2);
  tabsEl.classList.toggle('fade-r', tabsEl.scrollLeft < max - 2);
}
tabsEl.addEventListener('scroll', updateTabFade, { passive: true });
addEventListener('resize', updateTabFade);

// ---------- 小工具 ----------
const m = s => { const [h, mi] = s.split(':').map(Number); return h * 60 + mi; };
const hhmm = n => `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;
// 過了午夜還算同一天：記成 24:30、25:15，畫面上顯示 00:30、01:15。一天最晚排到隔天 05:00
const DAY_END = 29 * 60, NIGHT = 5 * 60;
const T = s => hhmm(m(s) % (24 * 60));                       // 顯示用
const clock = n => new Date(2026, 0, 1, Math.floor(n / 60) % 24, n % 60).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });   // 結束時間：跟時間輸入框同樣的格式
const fromInput = v => { const n = m(v); return n < NIGHT ? n + 24 * 60 : n; };   // 時間輸入框：00:00–04:59 當成當天深夜
const durLabel = n => n < 60 ? `${n} 分` : n % 60 === 0 ? `${n / 60}h` : n % 30 === 0 ? `${Math.floor(n / 60)}.5h` : `${Math.floor(n / 60)}h${n % 60}m`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'c' + Math.random().toString(36).slice(2, 9);
const MIN_NAV_H = 40;                // 區塊夠高才直接放導航鈕
const COMPACT_H = 46;                // 低於這個高度，時間改放在標題同一行
// 地圖欄位可以貼 Google 地圖網址，也可以只寫店名
const mapHref = q => /^https?:\/\//.test(q) ? q : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const TYPES = [['eat', '吃'], ['spa', '按摩'], ['cafe', '咖啡'], ['bar', '酒吧'], ['shop', '購物'], ['see', '景點'], ['other', '其他']];

// 筆記資料（從試算表的 Notes 分頁載入）：orig＝原文名稱，points＝重點整理，links＝參考連結
let NOTES = {};
// 有重點或連結才算有筆記（只有原文名稱的不出現筆記按鈕）
const richNote = k => { const n = NOTES[k]; return n && (n.points || n.links || n.full || n.photo) ? n : null; };

// ---------- 行程資料 ----------
const DAYS = [
  { date: '11/7',  wd: '週六', zh: '抵達＋古城',     en: 'Day 1.' },
  { date: '11/8',  wd: '週日', zh: '市集日',         en: 'Day 2.' },
  { date: '11/9',  wd: '週一', zh: '寧曼日',         en: 'Nimman Road.' },
  { date: '11/10', wd: '週二', zh: '大象＋黏黏瀑布', en: 'Day 4.' },
  { date: '11/11', wd: '週三', zh: '古城東側',       en: 'Day 5.' },
  { date: '11/12', wd: '週四', zh: '運動＋購物',     en: 'Day 6.' },
  { date: '11/13', wd: '週五', zh: '森林文青',       en: 'Day 7.' },
  { date: '11/14', wd: '週六', zh: '回程',           en: 'Day 8.' },
];
const PAGES = { overview: { en: 'Overview.', sub: '總覽' }, cand: { en: 'Maybe.', sub: '候選景點' } };

// ---------- 雲端資料（Google 試算表＋Apps Script） ----------
// 打開時先顯示上次存在手機裡的資料，背景再抓最新的；修改後畫面先更新，背景再存到雲端
const API = new URLSearchParams(location.search).get('api') ||
  'https://script.google.com/macros/s/AKfycbxqjZPsIR7HMdvpRtHD1_kfuaes_Vvjf0LopFQ9uXzAZUGs1OImHbUVpjR0szn9FdxmlQ/exec';
// 用 ?api= 指到測試伺服器時，手機裡的資料分開存，不會跟正式的混在一起
const TEST_SUFFIX = new URLSearchParams(location.search).get('api') ? '-test' : '';
const CACHE_KEY = 'cm-cache-v2' + TEST_SUFFIX, AUTH_KEY = 'cm-auth' + TEST_SUFFIX;
// DATA 裡除了 d1–d8，還有 days（標題），所以走訪行程時只看天數
const DAY_KEYS = ['d1', 'd2', 'd3', 'd4', 'd5', 'd6', 'd7', 'd8'];
const emptyData = () => { const d = { days: {} }; DAY_KEYS.forEach(k => d[k] = []); return d; };
const clone = o => JSON.parse(JSON.stringify(o));
let DATA = emptyData();
let BASE = { items: {}, days: {} };   // 最後一次跟雲端一致的樣子，用來找出哪些地方改過
let loaded = false, loadErr = false;  // 有沒有拿到過資料（雲端或手機裡存的）
// 編輯是「草稿」：按「完成」才存到雲端，按「取消」就回到 editStart（進入編輯時的樣子）
let editStart = null, resumeDraft = null;
// 完整筆記是共用的（同一家店出現在好幾天也只有一份），改了先記在 noteQueue，跟卡片一起存；noteOld 是這次編輯前的樣子，按「取消」時還原
let noteQueue = {}, noteOld = {};
try {
  const c = JSON.parse(localStorage.getItem(CACHE_KEY));
  if (c && c.data) {
    DATA = c.data; BASE = c.base; NOTES = c.notes || {}; loaded = true; resumeDraft = c.draft || null;
    noteQueue = c.noteQueue || {}; noteOld = c.noteOld || {};
  }
} catch {}
function cache() { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data: DATA, base: BASE, notes: NOTES, draft: editStart, noteQueue, noteOld })); } catch {} }

const getAuth = () => { try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch { return null; } };
const setAuth = a => { try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch {} };

// 呼叫 Apps Script：用 text/plain 送 JSON，瀏覽器才不會先送預檢請求（Apps Script 不支援）
async function api(body) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 40000);
  try {
    const r = body
      ? await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl.signal })
      : await fetch(API + '?action=load', { signal: ctl.signal });
    const j = await r.json();
    if (!j.ok) throw Object.assign(new Error(j.message), j);
    return j;
  } catch (e) {
    if (!e.code) e.code = 'network';   // 沒網路、逾時、Google 回傳的不是 JSON
    throw e;
  } finally { clearTimeout(timer); }
}

// 把雲端資料換成畫面用的格式
function applyServer(r) {
  DATA = emptyData(); BASE = { items: {}, days: {} };
  for (const k of DAY_KEYS) {
    const d = r.days[k] || {};
    DATA.days[k] = { ...d }; BASE.days[k] = { en: d.en, zh: d.zh };
  }
  for (const it of r.items) {
    if (!DATA[it.day]) continue;
    const { updated_by, updated_at, ...item } = it;
    DATA[it.day].push(item);
    BASE.items[it.id] = clone(it);
  }
  NOTES = {};
  for (const [k, n] of Object.entries(r.notes || {})) {
    NOTES[k] = { orig: n.orig, points: n.points && n.points.length ? n.points : undefined, links: n.links && n.links.length ? n.links : undefined,
                 full: n.full || undefined, photo: n.photo || undefined };
  }
  loaded = true; loadErr = false; cache();
}

// 比較內容時：空字串、false、空清單都當成「沒有」
const ITEM_KEYS = ['s', 'e', 'cls', 't', 'desc', 'map', 'travel', 'booked', 'alert', 'mine', 'note', 'group', 'stops', 'alts'];
const SUB_KEYS = ['s', 'dur', 'name', 'short', 'orig', 'area', 'desc', 'info', 'map', 'mine', 'note'];
const isEmpty = v => v === '' || v == null || v === false;
const canonSub = x => { const o = {}; SUB_KEYS.forEach(k => { if (!isEmpty(x[k])) o[k] = k === 'dur' ? +x[k] : x[k]; }); return o; };
const canon = it => {
  const o = {};
  for (const k of ITEM_KEYS) {
    let v = it[k];
    if (k === 'stops' || k === 'alts') { v = (v || []).map(canonSub); if (!v.length) continue; }
    if (!isEmpty(v)) o[k] = v;
  }
  return JSON.stringify(o);
};
const outItem = (it, day) => ({ ...JSON.parse(canon(it)), id: it.id, day });

// 跟上次存到雲端的樣子比，找出新增／修改、刪除、改標題
function diffOps(ref) {
  const changed = [], seen = new Set();
  for (const k of DAY_KEYS) for (const it of DATA[k]) {
    seen.add(it.id);
    const b = ref.items[it.id];
    if (!b || b.day !== k || canon(b) !== canon(it)) changed.push(outItem(it, k));
  }
  const deleted = Object.keys(ref.items).filter(id => !seen.has(id));
  const days = DAY_KEYS.filter(k => { const a = DATA.days[k] || {}, b = ref.days[k] || {}; return a.en !== b.en || a.zh !== b.zh; });
  return { changed, deleted, days, count: changed.length + deleted.length + days.length };
}
const pendingOps = () => { const o = diffOps(BASE), n = Object.keys(noteQueue).length; o.notes = n; o.count += n; return o; };   // 還沒存到雲端的
const draftCount = () => editStart ? diffOps(editStart).count + Object.keys(noteOld).length : 0;   // 這次編輯改了幾處
// 改完整筆記：有變才記下來，回傳有沒有改
function setNoteField(key, field, value) {
  const cur = NOTES[key] || {};
  if ((cur[field] || '') === value) return false;
  if (editing && !(key in noteOld)) noteOld[key] = NOTES[key] ? clone(NOTES[key]) : null;
  NOTES[key] = { ...cur, [field]: value || undefined };
  noteQueue[key] = true;
  return true;
}
const setFullNote = (key, full) => setNoteField(key, 'full', full);
// 有幾張卡片／幾家店共用這份筆記
function noteUsers(key) {
  let n = 0;
  for (const k of DAY_KEYS) for (const it of DATA[k] || []) {
    if ((it.note || it.t) === key && !it.group && !it.alts?.length) n++;
    (it.stops || []).concat(it.alts || []).forEach(x => { if (subNoteKey(x) === key) n++; });
  }
  return n;
}
// 編輯視窗裡的「照片」：放在筆記最上方。可以貼圖片網址，也可以從手機上傳（存到雲端硬碟）
function photoField(id, key) {
  const url = NOTES[key]?.photo || '', n = noteUsers(key);
  return `
    <div class="ed-field ed-photo"><span class="ed-lab">照片 <span class="ed-lab-hint">放在筆記最上方${n > 1 ? `，${n} 個地方共用` : ''}</span></span>
      <div class="ph-prev" id="${id}Prev"></div>
      <div class="ph-row"><input id="${id}" type="text" value="${esc(url)}" placeholder="貼上圖片網址" autocomplete="off" inputmode="url">
        <label class="btn ghost ph-up"><i class="ti ti-upload"></i> 上傳<input type="file" accept="image/*" id="${id}File" hidden></label></div>
      <div class="ph-st" id="${id}St"></div></div>`;
}
// 手機照片先縮到最長邊 1200px 的 JPG（大約 150–300KB），上傳比較快；同時留一份給畫面先顯示
function shrinkPhoto(file) {
  return new Promise((ok, fail) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      const dataUrl = c.toDataURL('image/jpeg', 0.82);
      ok({ dataUrl, b64: dataUrl.split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(u); fail(new Error('讀不到這張照片')); };
    img.src = u;
  });
}
// 上傳在背景進行：選好照片馬上看到預覽，可以繼續改別的、直接按儲存；傳完再自動補存網址
const pendingPhoto = {};   // 筆記代號 → 還在上傳的照片（先拿來顯示）
function wirePhoto(id, key) {
  const $ = x => sheet.querySelector('#' + x);
  const input = $(id); if (!input) return;
  const box = $(id + 'Prev'), st = $(id + 'St');
  const show = (src, badge) => {
    box.innerHTML = src ? `<img src="${esc(src)}" alt="">${badge ? `<span class="ph-badge">${badge}</span>` : ''}` : '<span>還沒有照片</span>';
    box.classList.toggle('empty', !src);
    const img = box.querySelector('img');
    if (img) img.onerror = () => { box.innerHTML = '<span>這個網址打不開，請換一個</span>'; box.classList.add('empty'); };
  };
  input.addEventListener('input', () => { sheet._photoJob = null; st.textContent = ''; show(input.value.trim()); });
  $(id + 'File').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const auth = getAuth();
    if (!auth) { st.textContent = '請先輸入通關密碼'; return; }
    let shot;
    try { shot = await shrinkPhoto(f); } catch (err) { st.textContent = err.message; return; }
    show(shot.dataUrl, '上傳中…'); st.textContent = '可以繼續編輯或直接按儲存，照片傳完會自動存好';
    input.value = ''; input.placeholder = '上傳中…'; input.disabled = true;
    const job = { dataUrl: shot.dataUrl, done: false };
    sheet._photoJob = job;
    const here = () => sheet._photoJob === job && sheet.classList.contains('on');
    job.promise = api({ ...auth, action: 'uploadPhoto', data: shot.b64, mime: 'image/jpeg', name: key || 'photo' })
      .then(r => {
        job.done = true; job.url = r.url;
        if (here()) { input.value = r.url; input.disabled = false; input.placeholder = '貼上圖片網址'; show(shot.dataUrl, '已上傳'); st.textContent = ''; }
        return r.url;
      })
      .catch(err => {
        job.done = true; job.err = err;
        const msg = err.code === 'network' ? '照片上傳失敗，請檢查網路再試一次' : '照片上傳失敗：' + err.message;
        if (here()) { input.disabled = false; input.placeholder = '貼上圖片網址'; show(''); st.textContent = msg; }
        else toast(msg);
        return null;
      });
  });
  show(input.value.trim());
}
// 儲存時：照片還在上傳就先記下來，傳完再補存；回傳這次有沒有動到照片
function savePhoto(id, key) {
  const input = sheet.querySelector('#' + id); if (!input) return false;
  const job = sheet._photoJob;
  if (job && !job.done) {
    pendingPhoto[key] = job.dataUrl;
    job.promise.then(url => {
      delete pendingPhoto[key];
      if (!url) return;
      setNoteField(key, 'photo', url); saveData(); toast('照片已存好');
      if (current) refreshView();
    });
    return true;
  }
  return setNoteField(key, 'photo', input.value.trim());
}
// 編輯視窗裡的「完整筆記」：直接展開，可以整篇修改
function fullNoteField(id, key) {

  return `
    <label class="ed-field ed-full"><span class="ed-lab">完整筆記</span>

// 把目前的資料拍一張快照（格式跟 BASE 一樣）
function snapshot() {
  const snap = { items: {}, days: {}, full: clone(DATA) };
  for (const k of DAY_KEYS) {
    for (const it of DATA[k]) snap.items[it.id] = { ...clone(it), day: k };
    snap.days[k] = { en: (DATA.days[k] || {}).en, zh: (DATA.days[k] || {}).zh };
  }
  return snap;
}

// ---------- 存到雲端 ----------
let syncing = false, syncAgain = false, syncTimer = null, retryTimer = null, nextLabel = '';
function saveData(label) {
  if (label) nextLabel = nextLabel && nextLabel !== label ? '修改' : label;
  cache();
  if (editing) { setSyncState('idle'); return; }   // 編輯中先存在手機，按「完成」才送到雲端
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, 300);
}
async function sync() {
  if (editing) return;
  if (syncing) { syncAgain = true; return; }
  clearTimeout(retryTimer);
  const ops = pendingOps();
  if (!ops.count) { if (syncState === 'error' || syncState === 'saving') setSyncState('idle'); return; }
  const noteKeys = Object.keys(noteQueue);
  const auth = getAuth();
  if (!auth) { setSyncState('error'); return; }
  syncing = true; setSyncState('saving');
  const label = nextLabel; nextLabel = '';
  try {
    if (noteKeys.length) {
      const notes = {};
      noteKeys.forEach(k => { const n = NOTES[k] || {}; notes[k] = { orig: n.orig, points: n.points, links: n.links, full: n.full, photo: n.photo || '' }; });
      await api({ ...auth, action: 'saveNotes', notes });
      noteKeys.forEach(k => delete noteQueue[k]);
    }
    if (ops.count > ops.notes) {
    // 所有修改合成一個請求送出，只要等一次
    const base = {};
    ops.changed.forEach(it => { if (BASE.items[it.id]) base[it.id] = BASE.items[it.id].updated_at; });
    const days = ops.days.map(k => ({ day: k, en: DATA.days[k].en, zh: DATA.days[k].zh }));
    const r = await api({ ...auth, action: 'commit', items: ops.changed, base, deleted: ops.deleted, days, label: label || undefined });
    r.items.forEach(x => BASE.items[x.id] = x);
    r.deleted.forEach(id => delete BASE.items[id]);
    r.days.forEach(d => BASE.days[d.day] = { en: d.en, zh: d.zh });
    }
    syncing = false; cache();
    if (syncAgain || pendingOps().count) { syncAgain = false; sync(); }
    else { setSyncState('saved'); if (!lastLoad) load(); }   // 一打開就有沒存上去的修改：存完再抓別人的更新
  } catch (e) {
    syncing = false; syncAgain = false;
    syncFailed(e);
  }
}
function syncFailed(e) {
  if (e.code === 'bad_pass' || e.code === 'no_nick') {
    setAuth(null); setSyncState('error', true);
    toast('通關密碼不對或已經換了，請重新輸入', '輸入', () => openAuth());
  } else if (e.code === 'conflict' || e.code === 'bad_input' || e.code === 'exists') {
    // 跟雲端對不起來：以雲端為準，重新載入
    const who = e.by && e.by.length ? `「${e.by[0]}」` : '別人';
    setSyncState('idle');
    toast(e.code === 'conflict' ? `${who}剛改過同一張卡片，已換成最新版本，你剛剛的修改沒有存到` : `沒有存成功：${e.message}`, '知道了', () => {});
    load(true);
  } else {
    setSyncState('error');
    retryTimer = setTimeout(sync, 20000);   // 網路不穩：20 秒後自動再試
  }
}
addEventListener('online', () => loaded ? sync() : load());

// 編輯列上的同步狀態
let syncState = 'idle', savedTimer = null;
function setSyncState(st, quiet) {
  syncState = st;
  const el = document.getElementById('ebSt');
  clearTimeout(savedTimer);
  const n = draftCount();
  el.innerHTML = {
    idle: n ? `已改 ${n} 處` : '點空白處新增',
    saving: '<i class="ti ti-cloud-upload"></i> 儲存中…',
    saved: '<i class="ti ti-cloud-check"></i> 已存到雲端',
    error: '<button type="button" class="eb-st err" id="ebRetry"><i class="ti ti-cloud-off"></i> 未存到雲端・重試</button>',
  }[st];
  const retry = document.getElementById('ebRetry');
  if (retry) retry.addEventListener('click', e => { e.stopPropagation(); getAuth() ? sync() : openAuth(); });
  if (st === 'saved') savedTimer = setTimeout(() => setSyncState('idle'), 2500);
  if (editing) return;
  if (st === 'saving') toast('儲存中…', null, null, 2500);
  if (st === 'saved') toast('已存到雲端');
  if (st === 'error' && !quiet) toast('有修改還沒存到雲端，會自動再試', '重試', () => getAuth() ? sync() : openAuth());
}

// ---------- 從雲端載入 ----------
let loading = false, lastLoad = 0, deferred = null;
let loadRetry = 0;
async function load(force) {
  if (loading) return;
  if (!force && (syncing || pendingOps().count)) { sync(); return; }   // 先把自己的修改存上去
  loading = true;
  try {
    const r = await api();
    lastLoad = Date.now(); loadRetry = 0;
    if (!force && (syncing || pendingOps().count)) return;   // 等待期間又改了東西：這次先不要蓋掉
    if (editing && !force) { deferred = r; return; }         // 編輯中不要整頁換掉，按「完成」後再套用
    applyServer(r); refreshView();
  } catch (e) {
    if (!loaded) { loadErr = true; refreshView(); setTimeout(load, 10000); }   // 還沒有任何資料：10 秒後再試
    else if (loadRetry < 5) { loadRetry++; setTimeout(load, 15000); }       // 先顯示手機裡的舊資料，雲端讀取失敗（Google 偶爾回錯誤頁）：15 秒後再試，最多 5 次
  } finally { loading = false; }
}
function refreshView() {
  if (!current) return;
  updateHeader(current);
  if (!drag && !busy && !sheet.classList.contains('on')) renderPage(current);
}
// 從別的 App 切回來、超過 1 分鐘沒更新：抓一次最新的
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !editing && Date.now() - lastLoad > 60000) load();
});

// 標題和主題：使用者改過的存在 DATA.days，沒改過就用預設值
const dayInfo = page => ({ ...DAYS[dayNum(page) - 1], ...(DATA.days?.[page] || {}) });
const itemsOf = page => (DATA[page] || []).slice().sort((a, b) => m(a.s) - m(b.s));

// 時間軸範圍：預設 9:00–22:00，有行程超出時自動延伸（所有天數共用，滑動時才對得齊）
let START = 9, END = 22, baseH = 0;
function computeRange() {
  let lo = 9 * 60, hi = 22 * 60;
  for (const k of DAY_KEYS) for (const it of DATA[k] || []) { lo = Math.min(lo, m(it.s)); hi = Math.max(hi, m(it.e)); }
  START = Math.floor(lo / 60); END = Math.min(29, Math.ceil(hi / 60));
  baseH = (END - START) * 60 * PX + 20;
}
const y = s => (m(s) - START * 60) * PX;

// ---------- 畫卡片 ----------
const movable = [];
let target = null, live = true;     // target：要放進去的容器；live＝false 時是滑動預覽用
function place(el, top) {
  el.classList.add('mv'); el.style.top = top + 'px'; el.dataset.t = top;
  (target || tl).appendChild(el); if (live) movable.push(el); return el;
}
function div(cls, html) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html || ''; return d; }

const hasNote = it => it.mine || richNote(it.note);
const noteBtn = it => hasNote(it) ? `<button class="note-btn" data-note-id="${it.id}" aria-label="${esc(it.t)} 的筆記"><i class="ti ti-notes"></i></button>` : '';
const noteBtnKey = (key, q) => richNote(key) ? `<button class="note-btn" data-note="${esc(key)}" data-q="${esc(q)}" aria-label="${esc(key)} 的筆記"><i class="ti ti-notes"></i></button>` : '';
const navBtn = (q, name) => `<a class="nav" target="_blank" rel="noopener" href="${esc(mapHref(q))}" aria-label="導航到 ${esc(name)}"><i class="ti ti-navigation"></i></a>`;
const editIc = '<span class="edit-ic" aria-hidden="true"><i class="ti ti-pencil"></i></span>';
const subEditIc = '<span class="sub-ed" aria-hidden="true"><i class="ti ti-pencil"></i></span>';
// 合併區塊裡的店家、多選一選項的筆記按鈕（筆記可能是 PDF 整理的，也可能是自己寫的）
const subNoteKey = sub => sub.note || sub.orig || sub.name;
const subNoteBtn = (id, kind, i, sub) => (sub.mine || richNote(subNoteKey(sub)))
  ? `<button class="note-btn" data-sub="${id}|${kind}|${i}" aria-label="${esc(sub.name)} 的筆記"><i class="ti ti-notes"></i></button>` : '';

const expanders = [];
function makeExpander(el, top, h, trigger) {
  el.style.height = h + 'px';
  place(el, top);
  if (!live) return;
  const ex = { el, top, h, trigger };
  expanders.push(ex);
  trigger.setAttribute('aria-expanded', 'false');
  const toggle = () => {
    const open = el.classList.toggle('open');
    trigger.setAttribute('aria-expanded', open);
    const chev = trigger.querySelector('.chev');
    if (chev) chev.className = 'ti chev ' + (open ? 'ti-chevron-up' : 'ti-chevron-down');
    relayout();
  };
  trigger.addEventListener('click', e => { if (e.target.closest('.nav, .list, .note-btn')) return; toggle(); });
  trigger.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
}
function relayout() {
  for (const ex of expanders) {
    ex.extra = ex.el.classList.contains('open') ? Math.max(0, ex.el.scrollHeight + 2 - ex.h) : 0;
    ex.el.style.height = ex.h + ex.extra + 'px';
  }
  let total = 0;
  for (const el of movable) {
    const t = +el.dataset.t;
    const off = expanders.filter(ex => ex.top < t).reduce((a, ex) => a + ex.extra, 0);
    el.style.top = t + off + 'px';
  }
  for (const ex of expanders) total += ex.extra;
  tl.style.height = baseH + total + 'px';
}

function renderGrid() {
  target = tl; live = true;
  for (let h = START; h <= END; h++) {
    place(div('hr', (h % 24) + ':00'), (h - START) * 60 * PX - 7);   // 過了午夜顯示 0:00、1:00
    place(div('ln'), (h - START) * 60 * PX);
  }
}
function buildLayer(page, isLive) {
  const layer = div('layer');
  target = layer; live = isLive;
  renderCards(itemsOf(page));
  target = null; live = true;
  return layer;
}
function renderCards(items) {
  // 時間重疊的卡片標紅框提醒
  const clash = new Set();
  items.forEach((a, i) => items.slice(i + 1).forEach(b => { if (m(b.s) < m(a.e) && m(a.s) < m(b.e)) { clash.add(a.id); clash.add(b.id); } }));
  // 時間重疊的卡片並排顯示（像 Google 日曆），才不會互相蓋住
  const cols = {};
  let cluster = [], clusterEnd = -1;
  const flush = () => { const n = Math.max(...cluster.map(c => cols[c.id].col)) + 1; cluster.forEach(c => cols[c.id].n = n); cluster = []; };
  for (const it of items) {
    if (cluster.length && m(it.s) >= clusterEnd) flush();
    const used = new Set(cluster.filter(c => m(c.e) > m(it.s)).map(c => cols[c.id].col));
    let col = 0; while (used.has(col)) col++;
    cols[it.id] = { col }; cluster.push(it); clusterEnd = Math.max(clusterEnd, m(it.e));
  }
  if (cluster.length) flush();
  const setCol = (el, id) => {
    const { col, n } = cols[id]; if (n < 2) return;
    el.style.left = `calc(4px + (100% - 4px) * ${col} / ${n})`;
    el.style.right = 'auto';
    el.style.width = `calc((100% - 4px) / ${n} - 3px)`;
  };
  items.forEach((it, i) => {
    const prev = items[i - 1];
    if (it.travel && prev) {
      // 交通時間放在上一張結尾與這一張開頭的正中間，空隙太小就不顯示
      const gap = y(it.s) - (y(prev.e) - 3);
      if (gap >= 14) place(div('car', `<i class="ti ti-car"></i> ${esc(it.travel)}`), Math.round(y(prev.e) - 3 + gap / 2 - 8));
    }
    const top = y(it.s), mins = m(it.e) - m(it.s), h = Math.max(mins * PX - 3, 28);
    const extra = clash.has(it.id) ? ' clash' : '';
    // 合併區塊：好幾站依序走；多選一：幾間都可以去，到時候挑一間。兩種都是可以展開的卡片
    const pick = !it.group && !!it.alts?.length;
    if (it.group || pick) {
      const g = div('grp ' + (it.cls || 'eat') + extra);
      g.dataset.id = it.id;
      g.setAttribute('role', 'button'); g.tabIndex = 0;
      const tags = (it.booked ? ' · <i class="ti ti-circle-check"></i> 已訂位' : '') + (it.alert ? ` · <i class="ti ti-alert-triangle"></i> ${esc(it.alert)}` : '');
      const rows = pick
        ? `<div class="cap">這幾間都可以去，到時候再一起選一間</div>${it.alts.map((a, i) => `
          <div class="stop" data-kind="alt" data-idx="${i}"><div class="num pick"></div>
            <div style="flex:1;min-width:0"><div class="n">${esc(a.name)}${subNoteBtn(it.id, 'alt', i, a)}</div>${a.desc ? `<div class="o">${esc(a.desc)}</div>` : ''}
              ${a.info ? `<div class="m">${esc(a.info)}</div>` : ''}</div>
            ${a.map ? navBtn(a.map, a.name) : ''}${subEditIc}
          </div>`).join('')}<button type="button" class="add-sub" data-kind="alt"><i class="ti ti-plus"></i> 新增選項</button>`
        : `${it.stops.map((st, i) => `
          <div class="stop" data-kind="stop" data-idx="${i}"><div class="num">${i + 1}</div>
            <div style="flex:1;min-width:0"><div class="n">${esc(st.name)}${subNoteBtn(it.id, 'stop', i, st)}</div>${st.orig ? `<div class="o">${esc(st.orig)}</div>` : ''}
              <div class="m"><i class="ti ti-clock"></i> ${T(st.s)} · ${durLabel(st.dur)}${st.area ? `　<i class="ti ti-map-pin"></i> ${esc(st.area)}` : ''}</div></div>
            ${st.map ? navBtn(st.map, st.name) : ''}${subEditIc}
          </div>`).join('')}<button type="button" class="add-sub" data-kind="stop"><i class="ti ti-plus"></i> 新增一站</button>`;
      g.innerHTML = `
        <div class="head"><span class="t" style="font-size:15px;font-weight:600">${pick
          ? `<i class="ti ti-arrows-split-2"></i> ${esc(it.t)}`
          : `<i class="ti ti-stack-2"></i> ${esc(it.t)} · ${it.stops.length} 站`}${editIc}</span><i class="ti ti-chevron-down chev"></i></div>
        <div class="sum"><div style="font-size:12px;line-height:1.6${pick ? ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis' : ''}">${pick
          ? esc(it.alts.map(a => a.name).join('／'))
          : esc(it.stops.map(st => st.short || st.name).join(' → '))}</div><div style="font-size:12px">${T(it.s)}–${T(it.e)} · ${durLabel(mins)}${tags}</div></div>
        <div class="list">${rows}</div>`;
      setCol(g, it.id);
      makeExpander(g, top, h, g);
      return;
    }
    const showNav = it.map && h >= MIN_NAV_H;
    // 描述：標題＋時間之外還放得下至少一行才顯示（半小時左右的小卡片就不顯示）
    const descLines = (it, h) => { const n = Math.floor((h - 52) / 16); return it.desc && n >= 1 ? `<div class="d" style="-webkit-line-clamp:${n}">${esc(it.desc)}</div>` : ''; };
    const compact = h < COMPACT_H;
    const tags = (it.booked ? ' · <span class="tag-ok"><i class="ti ti-circle-check"></i> 已訂位</span>' : '') +
                 (it.alert ? ` · <i class="ti ti-alert-triangle"></i> ${esc(it.alert)}` : '');
    const b = div('blk ' + it.cls + (showNav ? ' has-nav' : '') + (compact ? ' compact' : '') + extra,
      compact
        ? `<div class="t">${esc(it.t)}${noteBtn(it)}<span class="tm">· ${T(it.s)}–${T(it.e)}</span></div>${showNav ? navBtn(it.map, it.t) : ''}${editIc}`
        : `<div class="t">${esc(it.t)}${noteBtn(it)}</div>${descLines(it, h)}<div class="s">${T(it.s)}–${T(it.e)} · ${durLabel(mins)}${tags}</div>${showNav ? navBtn(it.map, it.t) : ''}${editIc}`);
    b.dataset.id = it.id;
    setCol(b, it.id);
    b.style.height = h + 'px'; place(b, top);
  });
}

// ---------- 換頁 ----------
const dayTitle = document.getElementById('dayTitle'), daySub = document.getElementById('daySub');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isDay = p => /^d[1-8]$/.test(p);
const dayNum = p => +p.slice(1);
let current = null, cardsEl = null, curLayer = null, busy = false;
const SLIDE_GAP = 28;   // 滑動時前後兩天卡片之間的距離

function updateHeader(page) {
  document.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.page === page;
    t.classList.toggle('on', on);
    if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  if (isDay(page)) {
    const d = dayInfo(page);
    dayTitle.textContent = d.en;
    daySub.innerHTML = `${d.date}．${d.wd}．<span id="subTheme">${esc(d.zh)}</span>`;
  } else {
    dayTitle.textContent = PAGES[page].en;
    daySub.textContent = page === 'overview' ? `${dayInfo('d1').date}–${dayInfo('d8').date}．${DAY_KEYS.length} 天 ${DAY_KEYS.length - 1} 夜` : PAGES[page].sub;
  }
  fab.classList.toggle('day', isDay(page));
  applyHeaderEditable();
  document.getElementById('ebDay').textContent = isDay(page) ? `第 ${dayNum(page)} 天` : '';
  document.querySelector('.tab.on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  updateTabFade();
}

let renderedPage = null;
function renderPage(page) {
  // 重畫同一頁（例如進出編輯模式、存檔後）時，記住哪些區塊是展開的
  const keepOpen = page === renderedPage ? expanders.filter(ex => ex.el.classList.contains('open')).map(ex => ex.el.dataset.id) : [];
  renderedPage = page;
  computeRange();
  tl.innerHTML = ''; movable.length = 0; expanders.length = 0;
  tl.classList.remove('sliding');
  ovEl.hidden = page !== 'overview';
  if (page === 'overview') renderOverview();
  if (!isDay(page)) { tl.style.display = 'none'; cardsEl = curLayer = null; return; }
  tl.style.display = ''; tl.style.height = baseH + 'px';
  renderGrid();
  cardsEl = div('cards'); tl.appendChild(cardsEl);
  curLayer = buildLayer(page, true); cardsEl.appendChild(curLayer);
  if (!loaded) tl.appendChild(div('tl-msg', loadErr ? '載入失敗，請檢查網路後重新整理' : '載入行程中…'));
  if (keepOpen.length) {
    for (const ex of expanders) if (keepOpen.includes(ex.el.dataset.id)) {
      ex.el.classList.add('open');
      ex.trigger.setAttribute('aria-expanded', 'true');
      const chev = ex.trigger.querySelector('.chev');
      if (chev) chev.className = 'ti chev ti-chevron-up';
    }
    relayout();
  }
  // 「現在時間」紅線先拿掉，之後考慮做成開關（樣式 .now 保留著）
}

// ---------- 總覽 ----------
const ovEl = document.getElementById('ov');
const TYPE_NAME = Object.fromEntries(TYPES);
// 標籤用短一點的名字：去掉括號裡的補充；「英文店名 中文說明」只留英文店名
function shortName(t) {
  t = t.replace(/[（(][^）)]*[）)]\s*$/, '').trim();
  const m = t.match(/^([A-Za-z0-9][A-Za-z0-9.&'’ -]*?)\s+[\u4e00-\u9fff]/);
  return m ? m[1] : t;
}
function renderOverview() {
  const days = DAY_KEYS.map(k => ({ k, info: dayInfo(k), items: [...(DATA[k] || [])].sort((a, b) => m(a.s) - m(b.s)) }));
  let html = '';
  if (!loaded) { ovEl.innerHTML = `<div class="ov-empty">${loadErr ? '載入失敗，請檢查網路後重新整理' : '載入行程中…'}</div>`; return; }
  // 小統計：按摩算次數，其他類型同一家只算一次；合併區塊裡的每一站各算一家，多選一算一家；交通、住宿（其他）不算
  const count = {}, seen = new Set();
  for (const d of days) for (const it of d.items) {
    const add = (cls, name) => {
      if (cls === 'other') return;
      if (cls !== 'spa' && name && seen.has(name)) return;
      seen.add(name); count[cls] = (count[cls] || 0) + 1;
    };
    if (it.group && it.stops?.length) it.stops.forEach(st => add(it.cls, st.name));
    else add(it.cls, it.alts?.length ? it.id : it.t);
  }
  const unit = { eat: '家', spa: '次', cafe: '家', bar: '家', shop: '處', see: '處' };
  // 每天：左邊日期和主題，右邊列出當天要去的地方（「其他」類型只列清邁機場，回家休息、放行李這類不列）
  const listed = it => it.cls !== 'other' || /清邁.*機場/.test(it.t);
  html += '<div class="ov-sec">每天</div>' + days.map(d => {
    const places = d.items.filter(listed).map(it => `
      <span class="ov-place"><span class="ov-dot ${it.cls || 'eat'}"></span><span class="nm">${esc(it.t)}</span>${it.booked ? '<i class="ti ti-circle-check ov-ok"></i>' : ''}</span>`).join('');
    return `<button type="button" class="ov-row" data-go="${d.k}"><span class="ov-when"><b>${d.info.date} ${d.info.wd}</b>${esc(d.info.zh || '')}</span>
      <span class="ov-places">${places || '<span class="ov-empty">還沒有行程</span>'}</span><i class="ti ti-chevron-right"></i></button>`;
  }).join('');
  html += '<div class="ov-sec">這趟旅程</div><div class="ov-stats">' + TYPES.filter(([k]) => count[k]).map(([k, n]) =>
    `<span class="ov-stat ${k}">${n}<b>${count[k]}</b>${unit[k] || '個'}</span>`).join('') + '</div>';
  // 已訂位：用標籤，點了跳到那一天
  const booked = days.flatMap(d => d.items.filter(it => it.booked).map(it => ({ d, it })));
  html += '<div class="ov-sec">已訂位</div>' + (booked.length
    ? '<div class="ov-chips">' + booked.map(({ d, it }) =>
      `<button type="button" class="ov-chip ${it.cls || 'eat'}" data-go="${d.k}"><b>${d.info.date} ${T(it.s)}</b> ${esc(shortName(it.t))}</button>`).join('') + '</div>'
    : '<div class="ov-empty">還沒有勾「已訂位」的行程</div>');
  ovEl.innerHTML = html;
}
ovEl.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) showPage(b.dataset.go); });

function collapseAll() {
  if (!expanders.some(ex => ex.el.classList.contains('open'))) return;
  for (const ex of expanders) {
    ex.el.classList.remove('open');
    ex.trigger.setAttribute('aria-expanded', 'false');
    const chev = ex.trigger.querySelector('.chev');
    if (chev) chev.className = 'ti chev ti-chevron-down';
  }
  relayout();
}

function slideTo(page, dir) {
  busy = true;
  collapseAll();
  tl.classList.add('sliding');
  const W = cardsEl.clientWidth + SLIDE_GAP;
  const next = buildLayer(page, false);
  next.style.transform = `translateX(${dir * W}px)`;
  cardsEl.appendChild(next);
  next.getBoundingClientRect();
  curLayer.classList.add('anim'); next.classList.add('anim');
  curLayer.style.transform = `translateX(${-dir * W}px)`;
  next.style.transform = 'translateX(0)';
  let done = false;
  const finish = () => { if (done) return; done = true; renderPage(page); busy = false; };
  next.addEventListener('transitionend', finish, { once: true });
  setTimeout(finish, 450);
}

function showPage(page, animate = true) {
  if (!/^(overview|cand|d[1-8])$/.test(page)) page = 'd3';
  if (page === current) return;
  const prev = current; current = page;
  updateHeader(page);
  if (animate && !reduceMotion && prev && isDay(prev) && isDay(page) && cardsEl && !busy) {
    slideTo(page, dayNum(page) > dayNum(prev) ? 1 : -1);
  } else {
    renderPage(page);
  }
  scrollTo({ top: 0 });
}

document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  if (location.hash !== '#' + t.dataset.page) location.hash = t.dataset.page;
});
let skipAnim = false;
addEventListener('hashchange', () => { showPage(location.hash.slice(1), !skipAnim); skipAnim = false; });

// ---------- 手指左右滑換天（編輯模式下關閉） ----------
let sw = null;
tl.addEventListener('touchstart', e => {
  if (editing || busy || !isDay(current) || e.touches.length > 1) return;
  const t = e.touches[0];
  sw = { x: t.clientX, y: t.clientY, t: performance.now(), dx: 0, lock: null, prev: null, next: null, W: cardsEl.clientWidth + SLIDE_GAP };
}, { passive: true });
tl.addEventListener('touchmove', e => {
  if (!sw) return;
  const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (!sw.lock) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    sw.lock = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'h' : 'v';
    if (sw.lock === 'v') { sw = null; return; }
    collapseAll();
    tl.classList.add('sliding');
    const n = dayNum(current);
    sw.toOv = n === 1;   // 第 1 天往右滑 → 總覽
    if (n > 1) { sw.prev = buildLayer('d' + (n - 1), false); cardsEl.appendChild(sw.prev); }
    if (n < 8) { sw.next = buildLayer('d' + (n + 1), false); cardsEl.appendChild(sw.next); }
    [curLayer, sw.prev, sw.next].forEach(l => l && l.classList.add('drag'));
  }
  let d = dx;
  if ((dx > 0 && !sw.prev && !sw.toOv) || (dx < 0 && !sw.next)) d = dx * 0.25;
  sw.dx = d;
  curLayer.style.transform = `translateX(${d}px)`;
  if (sw.prev) sw.prev.style.transform = `translateX(${d - sw.W}px)`;
  if (sw.next) sw.next.style.transform = `translateX(${d + sw.W}px)`;
}, { passive: true });
function endSwipe(cancelled = false) {
  if (!sw || sw.lock !== 'h') { sw = null; return; }
  const { dx, W, prev, next, toOv } = sw;
  const v = dx / Math.max(1, performance.now() - sw.t);
  // 系統中斷（例如來電）時一律彈回，不換頁
  const goNext = !cancelled && next && (dx < -W * 0.25 || (dx < -30 && v < -0.4));
  const goPrev = !cancelled && prev && (dx >  W * 0.25 || (dx >  30 && v >  0.4));
  [curLayer, prev, next].filter(Boolean).forEach(l => { l.classList.remove('drag'); l.classList.add('anim'); });
  busy = true;
  let done = false;
  const goOv = !cancelled && toOv && (dx > W * 0.25 || (dx > 30 && v > 0.4));
  if (goOv) {
    curLayer.style.transform = `translateX(${W}px)`;
    next?.remove();
    const finish = () => {
      if (done) return; done = true; busy = false;
      showPage('overview', false); location.hash = 'overview';
      playIn(ovEl, 'in-l');
    };
    curLayer.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 450);
  } else if (goNext || goPrev) {
    const dir = goNext ? 1 : -1, page = 'd' + (dayNum(current) + dir);
    updateHeader(page);
    curLayer.style.transform = `translateX(${-dir * W}px)`;
    (goNext ? next : prev).style.transform = 'translateX(0)';
    (goNext ? prev : next)?.remove();
    const finish = () => { if (done) return; done = true; busy = false; skipAnim = true; current = null; location.hash = page; };
    (goNext ? next : prev).addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 450);
  } else {
    curLayer.style.transform = 'translateX(0)';
    if (prev) prev.style.transform = `translateX(${-W}px)`;
    if (next) next.style.transform = `translateX(${W}px)`;
    const finish = () => {
      if (done) return; done = true;
      prev?.remove(); next?.remove();
      curLayer.classList.remove('anim'); curLayer.style.transform = '';
      tl.classList.remove('sliding'); busy = false;
    };
    curLayer.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 450);
  }
  sw = null;
}
tl.addEventListener('touchend', () => endSwipe());
const playIn = (el, cls) => { el.classList.remove('in-l', 'in-r'); void el.offsetWidth; el.classList.add(cls); el.addEventListener('animationend', () => el.classList.remove(cls), { once: true }); };
// 總覽往左滑 → 第 1 天
let osw = null;
ovEl.addEventListener('touchstart', e => {
  if (editing || e.touches.length > 1) return;
  const t = e.touches[0]; osw = { x: t.clientX, y: t.clientY, t: performance.now(), dx: 0, lock: null };
}, { passive: true });
ovEl.addEventListener('touchmove', e => {
  if (!osw) return;
  const t = e.touches[0], dx = t.clientX - osw.x, dy = t.clientY - osw.y;
  if (!osw.lock) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    osw.lock = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'h' : 'v';
    if (osw.lock === 'v') { osw = null; return; }
    ovEl.style.transition = 'none';
  }
  osw.dx = dx < 0 ? dx : dx * 0.25;   // 往右是盡頭，只拉得動一點點
  ovEl.style.transform = `translateX(${osw.dx}px)`;
}, { passive: true });
function ovSwipeEnd(cancelled) {
  if (!osw || osw.lock !== 'h') { osw = null; return; }
  const { dx } = osw, v = dx / Math.max(1, performance.now() - osw.t), W = ovEl.clientWidth;
  osw = null;
  const go = !cancelled && (dx < -W * 0.25 || (dx < -30 && v < -0.4));
  ovEl.style.transition = 'transform .22s ease';
  ovEl.style.transform = go ? `translateX(${-W}px)` : '';
  setTimeout(() => {
    if (go) { showPage('d1', false); location.hash = 'd1'; if (cardsEl) playIn(cardsEl, 'in-r'); }
    ovEl.style.transition = ''; ovEl.style.transform = '';
  }, go ? 200 : 240);
}
ovEl.addEventListener('touchend', () => ovSwipeEnd());
ovEl.addEventListener('touchcancel', () => ovSwipeEnd(true));
tl.addEventListener('touchcancel', () => endSwipe(true));

// ---------- 下方滑出的面板（筆記和編輯共用） ----------
const sheet = document.getElementById('sheet'), sheetBg = document.getElementById('sheetBg');
let lastFocus = null;
function openSheet(html, focusSel, dialog) {
  sheet.innerHTML = '<div class="grab"></div>' + html;
  sheet._photoJob = null;
  lastFocus = document.activeElement;
  sheet.scrollTop = 0;
  sheet.classList.toggle('dlg', !!dialog);
  if (dialog) placeDialog(); else sheet.style.top = '';
  sheet.classList.add('on'); sheetBg.classList.add('on');
  document.body.style.overflow = 'hidden';
  sheet.querySelector(focusSel || '.sh-close')?.focus({ preventScroll: true });
}
// 小視窗放在「看得到的範圍」正中間；鍵盤打開時，看得到的範圍會變小，視窗跟著往上移
function placeDialog() {
  if (!sheet.classList.contains('dlg')) return;
  const vv = window.visualViewport, top = vv ? vv.offsetTop : 0, h = vv ? vv.height : innerHeight;
  sheet.style.top = Math.round(top + Math.max(12, (h - sheet.offsetHeight) / 2)) + 'px';
}
if (window.visualViewport) { visualViewport.addEventListener('resize', placeDialog); visualViewport.addEventListener('scroll', placeDialog); }
function closeSheet() {
  if (sheet.classList.contains('dlg')) setTimeout(() => { if (!sheet.classList.contains('on')) { sheet.classList.remove('dlg'); sheet.style.top = ''; } }, 200);
  sheet.classList.remove('on'); sheetBg.classList.remove('on');
  document.body.style.overflow = '';
  lastFocus?.focus({ preventScroll: true });
}
// 完整筆記裡的網址變成可以點的連結（先跳脫再找網址，避免插入 HTML）
const linkify = t => esc(t).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function openNote(title, info, mine, q) {
  info = info || {};
  const pkey = Object.keys(pendingPhoto).find(k => NOTES[k] === info || k === title);
  if (pkey) info = { ...info, photo: pendingPhoto[pkey] };
  openSheet(`
    ${info.photo ? `<img class="sh-photo" src="${esc(info.photo)}" alt="" onerror="this.remove()">` : ''}
    <div class="sh-head"><div style="flex:1;min-width:0"><div class="sh-title" id="shTitle">${esc(title)}</div><div class="sh-sub">${esc(info.orig || '')}</div></div>
      ${q ? navBtn(q, title) : ''}<button class="sh-close" aria-label="關閉"><i class="ti ti-x"></i></button></div>
    ${mine ? `<div class="mine"><b>筆記摘要</b>${esc(mine)}</div>` : ''}
    ${info.points ? `<div class="sh-sec">重點整理</div><ul class="sh-list">${info.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
    ${info.full ? `<details class="full-note"${info.points ? '' : ' open'}><summary>完整筆記 <i class="ti ti-chevron-down"></i></summary>
      <div class="full-txt">${linkify(info.full)}</div></details>` : ''}
    ${info.links ? `<div class="sh-sec">參考連結</div><div class="sh-links">${info.links.map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener"><i class="ti ti-external-link"></i> ${esc(t)}</a>`).join('')}</div>` : ''}`);
}
const findItem = id => { for (const k of DAY_KEYS) { if (!DATA[k]) continue; const it = DATA[k].find(x => x.id === id); if (it) return [k, it]; } return [null, null]; };

document.addEventListener('click', e => {
  const b = e.target.closest('.note-btn');
  if (b && !editing) {
    e.stopPropagation();
    if (b.dataset.noteId) { const [, it] = findItem(b.dataset.noteId); openNote(it.t, NOTES[it.note], it.mine, it.map); }
    else if (b.dataset.sub) {
      const [id, kind, i] = b.dataset.sub.split('|'), sub = subList(findItem(id)[1], kind)[+i], info = NOTES[subNoteKey(sub)];
      openNote(sub.name, { ...info, orig: sub.orig || sub.desc || info?.orig }, sub.mine || info?.mine, sub.map);
    }
    else openNote(b.dataset.note, NOTES[b.dataset.note], NOTES[b.dataset.note]?.mine, b.dataset.q);
    return;
  }
  if (e.target.closest('.sh-close, .ed-cancel')) closeSheet();
}, true);
sheetBg.addEventListener('click', closeSheet);
// 往下拉關掉面板：拉上方的拉桿或標題列；內容已經捲到最上面時，在空白處往下拉也可以
let pull = null;
sheet.addEventListener('touchstart', e => {
  if (sheet.classList.contains('dlg') || e.touches.length > 1) return;
  const onHead = e.target.closest('.grab, .sh-head');
  if (!onHead && (sheet.scrollTop > 0 || e.target.closest('input, textarea, select, .chips, .full-txt'))) return;
  pull = { y0: e.touches[0].clientY, dy: 0, t0: Date.now(), active: false };
}, { passive: true });
sheet.addEventListener('touchmove', e => {
  if (!pull) return;
  const dy = e.touches[0].clientY - pull.y0;
  if (!pull.active) {
    if (dy < -6) { pull = null; return; }   // 往上滑：照常捲動內容
    if (dy < 6) return;
    pull.active = true; sheet.style.transition = 'none';
  }
  e.preventDefault();
  pull.dy = Math.max(0, dy);
  sheet.style.transform = `translateY(${pull.dy}px)`;
}, { passive: false });
const pullEnd = () => {
  const p = pull; pull = null;
  if (!p?.active) return;
  sheet.style.transition = ''; sheet.style.transform = '';
  if (p.dy > 90 || (p.dy > 30 && p.dy / (Date.now() - p.t0) > 0.5)) closeSheet();   // 拉夠遠、或快速往下一甩
};
sheet.addEventListener('touchend', pullEnd);
sheet.addEventListener('touchcancel', pullEnd);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('on')) closeSheet(); });

// ---------- 編輯模式 ----------
let editing = false;
const fab = document.getElementById('fab');
function setEditing(on) {
  editing = on;
  if (on && !editStart) editStart = snapshot();
  if (!on) { editStart = null; noteOld = {}; }
  cache();
  if (on) setSyncState('idle');
  if (!on && deferred) { const r = deferred; deferred = null; if (!pendingOps().count && !syncing) applyServer(r); }
  document.body.classList.toggle('editing', on);
  if (!on) document.activeElement?.blur();
  applyHeaderEditable();
  if (current) renderPage(current);
}
document.getElementById('editBtn').addEventListener('click', () => {
  if (!loaded) { toast('行程還在載入，請稍等'); return; }
  if (getAuth()) { setEditing(true); pressTip(); } else openAuth();
});
// 第一次進編輯模式時，說一次「長按卡片也能直接改」
function pressTip() {
  try { if (localStorage.getItem('cm-tip-press')) return; localStorage.setItem('cm-tip-press', '1'); } catch { return; }
  setTimeout(() => toast('小技巧：不用進編輯模式，長按卡片就能直接改那一張', '知道了', () => {}, 8000), 2200);
}
document.getElementById('editDone').addEventListener('click', () => {
  document.activeElement?.blur();   // 標題正在原地編輯的話，先收下來
  setEditing(false);
  if (pendingOps().count) sync();
});
document.getElementById('editCancel').addEventListener('click', () => {
  document.activeElement?.blur();
  const n = draftCount();
  if (!n) { setEditing(false); return; }
  openSheet(`
    <div class="sh-head"><div style="flex:1;min-width:0"><div class="sh-title" id="shTitle">要放棄這次的 ${n} 處修改嗎？</div>
      <div class="sh-sub">會回到按編輯之前的樣子，雲端的行程不會被動到</div></div>
      <button class="sh-close" aria-label="關閉"><i class="ti ti-x"></i></button></div>
    <div class="ed-actions">
      <button type="button" class="btn ghost ed-cancel" style="flex:1">繼續編輯</button>
      <button type="button" class="btn primary" id="cxGo" style="background:#C2412D">放棄修改</button>
    </div>`, '.ed-cancel', true);
  sheet.querySelector('#cxGo').addEventListener('click', () => {
    DATA = clone(editStart.full);
    for (const [k, v] of Object.entries(noteOld)) { if (v) NOTES[k] = v; else delete NOTES[k]; delete noteQueue[k]; }
    closeSheet(); setEditing(false); toast('已放棄修改');
  });
});
// 暱稱＋通關密碼：記在這支手機，之後就不用再輸入
function openAuth(then) {
  const old = getAuth() || {};

function wireEditor() {
  const $ = id => sheet.querySelector('#' + id);
  const refresh = () => {
    const sMin = $('edS').value ? fromInput($('edS').value) : m(ed.s), eMin = sMin + ed.dur;
    $('edEnd').textContent = clock(eMin); $('edMid').hidden = eMin <= 24 * 60;
    if ($('edDurTxt')) $('edDurTxt').textContent = durLabel(ed.dur);
    sheet.querySelectorAll('#edDur .chip').forEach(c => c.classList.toggle('on', +c.dataset.v === ed.dur));
    // 時間有變時，才問要不要把後面的行程一起移動
    if ($('edPushWrap')) {
      const delta = eMin - m(ed.orig.e);
      $('edPushWrap').hidden = delta === 0 || !laterItems().length;
      $('edPushTxt').textContent = delta ? `（${delta > 0 ? '往後' : '提前'} ${durLabel(Math.abs(delta))}）` : '';
    }
    $('edTimeErr').hidden = true;
  };
  sheet.querySelector('#edCls')?.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    ed.cls = c.dataset.v;
    sheet.querySelectorAll('#edCls .chip').forEach(x => x.classList.toggle('on', x === c));
  });
  // 卡片樣式：改成「多個地點」或「多選一」時，上面的名稱變成第一站／第一個選項，另外取一個卡片標題
  $('edKind')?.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    ed.kind = c.dataset.v;
    sheet.querySelectorAll('#edKind .chip').forEach(x => x.classList.toggle('on', x === c));
    const multi = ed.kind !== 'one';
    $('edGTWrap').hidden = !multi;
    $('edTLab').textContent = { one: '名稱', group: '第一站', pick: '第一個選項' }[ed.kind];
    $('edGT').placeholder = ed.kind === 'group' ? '例如：寧曼小吃巡禮' : '例如：早餐二選一';
    $('edKindHint').innerHTML = '<i class="ti ti-info-circle"></i> ' + (ed.kind === 'group'
      ? '存好後展開卡片，按「新增一站」加入下一站，或在編輯模式長按別張卡片拖進來'
      : '存好後展開卡片，按「新增選項」加入其他店，或在編輯模式長按別張卡片拖進來');
    if (multi) $('edGT').focus();
  });
  $('edGT')?.addEventListener('input', () => { $('edGTErr').hidden = true; });
  $('edDur')?.addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) { ed.dur = +c.dataset.v; refresh(); } });
  sheet.querySelectorAll('.step').forEach(b => b.addEventListener('click', () => { ed.dur = Math.max(5, ed.dur + +b.dataset.d); refresh(); }));
  $('edS').addEventListener('input', refresh);
  $('edT').addEventListener('input', () => { $('edTErr').hidden = true; updateMapStatus(); });
  // 地圖欄位：即時說明現在存的是「連結」還是「用店名搜尋」
  const updateMapStatus = () => {
    const box = $('edMapStatus'); if (!box) return;
    const v = $('edMap').value.trim(), name = $('edT').value.trim();
    const find = name ? `<br><a href="${esc(mapHref(name + ' Chiang Mai'))}" target="_blank" rel="noopener">去 Google 地圖找「${esc(name)}」</a>` : '';
    if (!v) box.innerHTML = `<i class="ti ti-map-pin-off"></i> 還沒設定地點，卡片上不會出現導航按鈕${find}`;
    else if (/^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|(www\.)?google\.[a-z.]+\/maps|share\.google)/i.test(v))
      box.innerHTML = '<span class="ok"><i class="ti ti-map-pin-check"></i> 已連結地點</span>，導航會直接打開這個地點';
    else if (/^https?:\/\//i.test(v)) box.innerHTML = '<i class="ti ti-link"></i> 已連結網址（不是 Google 地圖連結，可能無法導航）';
    else box.innerHTML = `<i class="ti ti-search"></i> 貼上 Google Map 的店名或是 Google Map 連結${find}`;
  };
  $('edMap')?.addEventListener('input', updateMapStatus);
  updateMapStatus();
  wirePhoto('edPhoto', ed.noteKey || $('edT').value.trim());
  $('edSave').addEventListener('click', saveEditor);
  $('edDel')?.addEventListener('click', deleteItem);
  refresh();
}
// 原本排在這張「後面」的行程（用原本的開始時間判斷）
function laterItems() {
  if (!ed || ed.isNew) return [];
  return DATA[current].filter(x => x.id !== ed.id && m(x.s) >= m(ed.orig.s));
}

function saveEditor() {
  const $ = id => sheet.querySelector('#' + id);
  const t = $('edT').value.trim();
  if (!t) { $('edTErr').hidden = false; $('edT').focus(); return; }
  const gt = ed.kind !== 'one' ? $('edGT').value.trim() : '';
  // 完整筆記：新卡片用名稱當筆記代號；這張卡片原本沒有連到筆記的話，順便連上
  const fullEl = $('edFull'), noteKey = ed.noteKey || t;
  if (fullEl) setFullNote(noteKey, fullEl.value.trim());
  const photoTouched = savePhoto('edPhoto', noteKey);
  if (ed.kind !== 'one' && !gt) { $('edGTErr').hidden = false; $('edGT').focus(); return; }
  const sMin = $('edS').value ? fromInput($('edS').value) : m(ed.s), eMin = sMin + ed.dur;
  const timeErr = msg => { $('edTimeErr').textContent = msg; $('edTimeErr').hidden = false; };
  if (eMin > DAY_END) return timeErr('最晚只能排到凌晨 05:00');
  const push = $('edPush')?.checked;
  const delta = ed.isNew ? 0 : eMin - m(ed.orig.e);
  if (push && laterItems().some(x => m(x.e) + delta > DAY_END)) return timeErr('順延後有行程會超過凌晨 05:00，請調整一下');
  if (!ed.isNew && ed.booked && (hhmm(sMin) !== ed.orig.s || hhmm(eMin) !== ed.orig.e) &&
      !confirm('這是已訂位的行程，確定要改時間嗎？')) return;
  const fields = { t, s: hhmm(sMin), e: hhmm(eMin), travel: $('edTravel').value.trim() };
  if (!ed.group) Object.assign(fields, {
    cls: ed.cls, ...(ed.pick ? {} : { map: $('edMap').value.trim(), desc: $('edDesc').value.trim() }),
    ...(fullEl && (NOTES[noteKey] || photoTouched) ? { note: noteKey } : {}), booked: $('edBooked').checked,
    alert: $('edAlert').value.trim(), mine: $('edMine').value.trim(),
  });
  if (ed.kind !== 'one') {
    // 這張卡片變成第一站／第一個選項，卡片本身改用新的標題
    const it = ed.isNew ? { id: uid() } : findItem(ed.id)[1];
    if (!ed.isNew && push && delta) laterItems().forEach(x => { x.s = hhmm(m(x.s) + delta); x.e = hhmm(m(x.e) + delta); });
    const first = { name: t, desc: fields.desc, map: fields.map, mine: fields.mine, note: it.note || (NOTES[t] ? t : '') };
    Object.assign(it, fields, { t: gt, desc: '', map: '', mine: '', note: '' });
    if (ed.kind === 'group') { it.group = true; it.stops = [{ ...first, desc: undefined, s: fields.s, dur: ed.dur }]; delete it.alts; }   // 合併區塊的每一站沒有描述欄位
    else { it.alts = [{ ...first, info: fields.alert }]; it.alert = ''; }   // 「只收現金」這類提醒是那一家店的，跟著選項走
    if (ed.isNew) DATA[current].push(it);
    saveData(); closeSheet(); renderPage(current);
    toast(`已建立「${gt}」，展開後可以加入更多${ed.kind === 'group' ? '站' : '選項'}`);
    return;
  }
  if (ed.isNew) {
    DATA[current].push({ id: uid(), ...fields });
  } else {
    if (push && delta) laterItems().forEach(x => { x.s = hhmm(m(x.s) + delta); x.e = hhmm(m(x.e) + delta); });
    // 合併區塊整組移動：裡面每一站跟著平移
    if (ed.group) { const shift = sMin - m(ed.orig.s); if (shift) findItem(ed.id)[1].stops.forEach(x => x.s = hhmm(m(x.s) + shift)); }
    Object.assign(findItem(ed.id)[1], fields);
  }
  saveData(); closeSheet(); renderPage(current);
  toast(ed.isNew ? '已新增' : push && delta ? `已儲存，後面 ${laterItems().length} 個行程一起${delta > 0 ? '順延' : '提前'}` : '已儲存');
}

function deleteItem() {
  const day = current, list = DATA[day], idx = list.findIndex(x => x.id === ed.id), removed = list[idx];
  list.splice(idx, 1);
  saveData(); closeSheet(); renderPage(current);
  toast(`已刪除「${removed.t}」`, '復原', () => { DATA[day].splice(idx, 0, removed); saveData(); if (current === day) renderPage(day); toast('已復原'); });
}

function fitGroup(card) {
  if (!card.stops?.length) return false;
  const s = hhmm(Math.min(...card.stops.map(x => m(x.s)))), e = hhmm(Math.max(...card.stops.map(x => m(x.s) + x.dur)));
  const changed = s !== card.s || e !== card.e;
  card.s = s; card.e = e; return changed;
}
const subList = (it, kind) => kind === 'stop' ? it.stops : (it.alts = it.alts || []);
const mapStatusHtml = (v, name) => {
  const find = name ? `<br><a href="${esc(mapHref(name + ' Chiang Mai'))}" target="_blank" rel="noopener">去 Google 地圖找「${esc(name)}」</a>` : '';

  if (/^https?:\/\//i.test(v)) return '<i class="ti ti-link"></i> 已連結網址（不是 Google 地圖連結，可能無法導航）';
  return `<i class="ti ti-search"></i> 貼上 Google Map 的店名或是 Google Map 連結${find}`;

function saveSub() {

  if (name !== old.name) delete sub.short;                      // 改了名字，收合時就顯示新名字

  const noteKey = sed.isNew ? name : subNoteKey(old);
  const fullChanged = setFullNote(noteKey, $('sbFull').value.trim()), photoChanged = savePhoto('sbPhoto', noteKey);

  if (isStop) {

    Object.assign(sub, { s: hhmm(sMin), dur: sed.dur, orig: $('sbSub').value.trim(), area: $('sbArea').value.trim() });
  } else Object.assign(sub, { desc: $('sbSub').value.trim(), info: $('sbInfo').value.trim() });
  if (sed.isNew) list.push(sub); else list[sed.idx] = sub;
  let note = sed.isNew ? (isStop ? '已新增一站' : '已新增選項') : '已儲存';
  if (isStop) {
    list.sort((a, b) => m(a.s) - m(b.s));
    if (fitGroup(card)) note += `，區塊時間調整為 ${T(card.s)}–${T(card.e)}`;
  }
  saveData(); closeSheet(); renderPage(current); toast(note);
}
function deleteSub() {
  const [, card] = findItem(sed.cardId), list = subList(card, sed.kind), { idx, kind, cardId } = sed;
  if (kind === 'stop' && list.length <= 1) {
    const err = sheet.querySelector('#sbErr'); err.textContent = '合併區塊至少要有一站。要整個刪掉，請點區塊標題進入編輯'; err.hidden = false; return;
  }
  const removed = list.splice(idx, 1)[0];
  if (kind === 'alt' && !list.length) delete card.alts;
  if (kind === 'stop') fitGroup(card);
  saveData(); closeSheet(); renderPage(current);
  toast(`已刪除「${removed.name}」`, '復原', () => {
    const c = findItem(cardId)[1]; if (!c) return;
    subList(c, kind).splice(idx, 0, removed); if (kind === 'stop') fitGroup(c); saveData(); renderPage(current); toast('已復原');
  });
}

// ---------- 底部提示 ----------
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg, actionText, action, ms) {
  toastEl.innerHTML = `<span>${esc(msg)}</span>${actionText ? `<button type="button">${esc(actionText)}</button>` : ''}`;
  toastEl.classList.add('on');
  if (actionText) toastEl.querySelector('button').onclick = () => { toastEl.classList.remove('on'); action(); };
  clearTimeout(toastTimer);
  if (ms !== 0) toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms || (actionText ? 5000 : 2000));
}

showPage(location.hash.slice(1) || 'd3', false);
if (resumeDraft && getAuth()) {
  editStart = resumeDraft;
  setEditing(true);
  if (draftCount()) toast('上次的修改還沒完成：按「完成」儲存，或按「取消」放棄', '知道了', () => {});
}
load();
</script>
